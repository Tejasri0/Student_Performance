<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body{
            background-color: #87CEEB;
            text-align: center;
            padding-top: 30px;
        }

        .container{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 50%;
        }

        input{
            margin: 10px;
            padding: 8px;
            width: 80%;
        }

        h1{
            color: darkblue;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <form action="/predict" method="POST">

        <input type="text" name="Hours_Studied"
               placeholder="Hours Studied" required><br>

        <input type="text" name="Previous_Scores"
               placeholder="Previous Scores" required><br>

        <input type="text" name="Extracurricular_Activities"
               placeholder="Extracurricular Activities (0 or 1)" required><br>

        <input type="text" name="Sleep_Hours"
               placeholder="Sleep Hours" required><br>

        <input type="text" name="Sample_Question_Papers_Practiced"
               placeholder="Sample Question Papers Practiced" required><br>

        <button type="submit" class="btn btn-success">
            Predict
        </button>

    </form>

    <br>

    <h3>
        <strong>{{ prediction_text }}</strong>
    </h3>

    <br>

    <h4>Machine Learning Regression Project</h4>
    <h5>Student Performance Prediction System</h5>

</div>

</body>
</html>
